[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cauco-core"
version = "0.1.0"
description = "Local HTTP service for Cauco"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
cauco-core = "cauco_core.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/cauco_core"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
