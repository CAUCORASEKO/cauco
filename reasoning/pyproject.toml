[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cauco-reasoning"
version = "0.1.0"
description = "Provider-neutral reasoning contracts for Cauco"
requires-python = ">=3.11"

[project.optional-dependencies]
deepagents = ["deepagents>=0.7.8,<1"]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cauco_reasoning"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
